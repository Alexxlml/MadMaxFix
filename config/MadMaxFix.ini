; MadMaxFix configuration. Place this file next to MadMax.exe (optional: these are the defaults).

[General]
; 1 = write MadMaxFix.log next to the game
Log=1

[ModeList]
; Fixes the Settings menu opened from the main menu by limiting the display-mode list
Enabled=1
; Unique rows (resolution + refresh rate) per monitor. 160 is tested; 175 or more breaks the menu.
MaxRows=160

[ScrapCrew]
; Restores Scrap Crew rewards without WB's online servers
Enabled=1
; Scrap per hour while the game is closed, for each stronghold with the Scrap Crew project
ScrapPerHour=100
; Maximum per stronghold for each payout. The game itself never pays more than 500.
ScrapCap=500
